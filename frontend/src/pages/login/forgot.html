<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 | OptiSolver</title>
    <style>
        :root {
    --primary: #6366f1;
    --secondary: #10b981;
    --accent: #f59e0b;
    --glass: rgba(255, 255, 255, 0.85);
}
html,body{
    margin: 0;
}

/* 布局样式 */
.container {
    display: flex;
    height: 100vh;
    background: radial-gradient(circle at 50% 0%, #f8fafc 0%, #f1f5f9 100%);
}

/* 左侧海报 */
.poster {
    flex: 1;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    position: relative;
}

.poster-content {
    backdrop-filter: blur(12px);
    background: rgba(255, 255, 255, 0.15);
    padding: 2rem;
    border-radius: 12px;
}

.poster h1 {
    font-size: 2.5rem;
    font-weight: bold;
    background: linear-gradient(135deg, #fff, #ddd);
    -webkit-background-clip: text;
    color: transparent;
}

.poster h1 span {
    color: var(--accent);
}

.poster p {
    font-size: 1.2rem;
    margin-top: 0.5rem;
}

/* 右侧框架 */
.login-section {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
}

.login-card {
    background: var(--glass);
    backdrop-filter: blur(12px);
    padding: 3rem;
    border-radius: 1.8rem;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    text-align: center;
    max-width: 400px;
    width: 100%;
}

/* 输入框 */
.input-group {
    margin-bottom: 1rem;
}

.input-group input {
    width: 100%;
    padding: 0.8rem;
    border-radius: 50px;
    border: 1px solid rgba(99, 102, 241, 0.3);
    font-size: 1rem;
}

/* CTA 按钮 */
.cta-btn {
    width: 100%;
    padding: 1rem;
    font-size: 1.1rem;
    font-weight: bold;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    border-radius: 50px;
}

/* 响应式 */
@media (max-width: 768px) {
    .container {
        flex-direction: column;
    }

    .poster {
        height: 40vh;
    }

    .login-section {
        height: 60vh;
    }
}

    </style>
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const email = document.getElementById('email').value;

    if (!email) {
        alert('请输入您的邮箱！');
        return;
    }

    alert('重置链接已发送，请检查您的邮箱！');
});

    </script>
</head>
<body>
    <div class="container">
        <!-- 左侧海报 -->
        <div class="poster">
            <div class="poster-content">
                <h1>忘记密码？</h1>
                <p>请输入您的邮箱，我们将发送重置链接</p>
            </div>
        </div>

        <!-- 右侧找回密码框 -->
        <div class="login-section">
            <div class="login-card">
                <h2 class="brand">找回密码</h2>
                <p class="description">请输入您的邮箱以重置密码</p>

                <form id="forgotPasswordForm">
                    <div class="input-group">
                        <input type="email" id="email" placeholder="邮箱" required>
                    </div>

                    <button type="submit" class="cta-btn">发送重置链接</button>
                </form>

                <div class="extra-links">
                    记得密码了？<a href="login.html">返回登录</a>
                </div>
            </div>
        </div>
    </div>

    <script src="forgot-password.js"></script>
</body>
</html>
