<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 | OptiSolver</title>
    <style>
        body,html{
            margin: 0;
        }
        :root {
            --primary: #6366f1;    /* 现代紫色 */
            --secondary: #10b981;  /* 翡翠绿 */
            --accent: #f59e0b;     /* 琥珀色 */
            --glass: rgba(255, 255, 255, 0.85);
        }

/* 布局样式 */
.container {
    display: flex;
    height: 100vh;
    background: radial-gradient(circle at 50% 0%, #f8fafc 0%, #f1f5f9 100%);
}

/* 左侧海报 */
.poster {
    flex: 1;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    position: relative;
}

.poster-content {
    backdrop-filter: blur(12px);
    background: rgba(255, 255, 255, 0.15);
    padding: 2rem;
    border-radius: 12px;
}

.poster h1 {
    font-size: 2.5rem;
    font-weight: bold;
    background: linear-gradient(135deg, #fff, #ddd);
    -webkit-background-clip: text;
    color: transparent;
}

.poster h1 span {
    color: var(--accent);
}

.poster p {
    font-size: 1.2rem;
    margin-top: 0.5rem;
}

/* 右侧登录框 */
.login-section {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
}

.login-card {
    background: var(--glass);
    backdrop-filter: blur(12px);
    padding: 3rem;
    border-radius: 1.8rem;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    text-align: center;
    max-width: 400px;
    width: 100%;
    position: relative;
}

/* 渐变标题 */
.brand {
    font-size: 2rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.description {
    font-size: 1rem;
    color: #4a5568;
    margin-bottom: 1.8rem;
}

/* 输入框 */
.input-group {
    margin-bottom: 1rem;
}

.input-group input {
    width: 100%;
    padding: 0.8rem;
    border-radius: 50px;
    border: 1px solid rgba(99, 102, 241, 0.3);
    font-size: 1rem;
    outline: none;
    transition: all 0.3s ease-in-out;
}

.input-group input:hover {
    box-shadow: 0 0 8px rgba(99, 102, 241, 0.2);
}

.input-group input:focus {
    box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
}

/* CTA 按钮 */
.cta-btn {
    width: 100%;
    padding: 1rem;
    font-size: 1.1rem;
    font-weight: bold;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease-in-out;
    box-shadow: 0 5px 15px rgba(99, 102, 241, 0.15);
    position: relative;
    overflow: hidden;
}

.cta-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: 0.5s;
}

.cta-btn:hover::before {
    left: 100%;
}

.cta-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(99, 102, 241, 0.25);
}

/* 额外链接 */
.extra-links {
    margin-top: 1rem;
    font-size: 0.9rem;
}

.extra-links a {
    color: var(--primary);
    text-decoration: none;
    transition: color 0.2s;
}

.extra-links a:hover {
    color: var(--secondary);
    text-decoration: underline;
}

/* 响应式 */
@media (max-width: 768px) {
    .container {
        flex-direction: column;
    }

    .poster {
        height: 40vh;
    }

    .login-section {
        height: 60vh;
    }
}

    </style>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (!username || !email || !password || !confirmPassword) {
        alert('请填写完整信息！');
        return;
    }

    if (password !== confirmPassword) {
        alert('两次输入的密码不一致！');
        return;
    }

    alert('注册成功！');
});

    </script>
</head>
<body>
    <div class="container">
        <!-- 左侧海报 -->
        <div class="poster">
            <div class="poster-content">
                <h1>加入 <span>OptiSolver</span></h1>
                <p>智能优化求解平台，助力您的数据决策</p>
            </div>
        </div>

        <!-- 右侧注册框 -->
        <div class="login-section">
            <div class="login-card">
                <h2 class="brand">注册</h2>
                <p class="description">创建您的账户，开启优化之旅</p>

                <form id="registerForm">
                    <div class="input-group">
                        <input type="text" id="username" placeholder="用户名" required>
                    </div>

                    <div class="input-group">
                        <input type="email" id="email" placeholder="邮箱" required>
                    </div>

                    <div class="input-group">
                        <input type="password" id="password" placeholder="密码" required>
                    </div>

                    <div class="input-group">
                        <input type="password" id="confirmPassword" placeholder="确认密码" required>
                    </div>

                    <button type="submit" class="cta-btn">注册</button>
                </form>

                <div class="extra-links">
                    已有账户？<a href="./login">立即登录</a>
                </div>
            </div>
        </div>
    </div>

    <script src="register.js"></script>
</body>
</html>
